<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--f:'Plus Jakarta Sans',-apple-system,'SF Pro Display',system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%;background:var(--bg);transition:background .4s}
body{font:500 16px/1.45 var(--f);color:var(--ink);max-width:560px;margin:0 auto;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
main{padding:8px 16px 0}

.top{display:flex;justify-content:space-between;align-items:flex-end;padding:18px 4px 18px}

.card,.tile,.hero{border-radius:30px;margin-bottom:14px}
.card{background:var(--card);padding:20px;box-shadow:var(--sh)}

.sw.on{background:var(--c3)}.sw.on:after{transform:translateX(20px)}

.pill{display:inline-block;background:rgba(255,255,255,.22);padding:6px 13px;border-radius:99px;font-weight:700;font-size:13px}
.q{font-size:29px;font-weight:800;letter-spacing:-.03em;line-height:1.12;margin:16px 0 8px}
.pb{height:8px;background:var(--in);border-radius:9px;overflow:hidden;margin:0 4px 16px}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2));border-radius:9px;transition:.5s}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;margin-top:10px;padding:14px 16px;border-radius:22px;border:0;background:rgba(255,255,255,.18);color:#fff;font:600 16px var(--f);transition:.2s}
.opt .lt{width:30px;height:30px;flex:none;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:13px;background:rgba(255,255,255,.25)}
.opt.on{background:#fff;color:#16162A;box-shadow:0 12px 22px -10px rgba(0,0,0,.4)}.opt.on .lt{background:var(--c1);color:#fff}
.nav{display:flex;justify-content:space-between;margin-top:18px}
.nav .g{background:rgba(255,255,255,.2);color:#fff}.nav .btn:not(.g){background:#fff;color:var(--c1);box-shadow:none}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.dots button{aspect-ratio:1;border:0;border-radius:14px;background:var(--in);color:var(--mut);font:700 13px var(--f)}
.dots .ans{background:color-mix(in srgb,var(--c3) 35%,var(--in));color:var(--ink)}.dots .on{background:var(--c1);color:#fff}
.ent{padding:13px 0;border-bottom:1px solid var(--ln)}.ent:last-child{border:0}.ent b{font-weight:800}.ent div{color:var(--mut);font-size:14px;margin-top:2px}
.add{display:flex;gap:8px}.add input{margin:0}
.tabs{background:var(--card);position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;display:flex;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(26px) saturate(1.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);border-top:1px solid var(--ln)}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:700 11px var(--f);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0}
.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs .on{color:var(--c1)}.tabs .on svg{fill:color-mix(in srgb,var(--c1) 22%,transparent)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

const $=s=>document.querySelector(s);
let S;try{S=JSON.parse(localStorage.getItem('jr3')||'')}catch(e){}S=S||{days:{},ans:{},todo:{}};

const dk=(o=0)=>{const d=new Date();d.setDate(d.getDate()+o);return d.toLocaleDateString('en-CA')};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D=()=>S.days[dk()]||(S.days[dk()]={mood:0,tags:[],r:{}});
const T=d=>S.todo[d]||(S.todo[d]=[]);
const MO=['😞','😕','😐','🙂','😄'],ML=['Rough','Low','Okay','Good','Great'];
const OR=[['#6B6890','#A29EC8'],['#5B7CFA','#8FA8FF'],['#8F7CFF','#FFB27A'],['#2EC4B6','#9BE8A0'],['#FF9F5A','#FFD36B']];
const TG=['Calm','Happy','Grateful','Proud','Motivated','Tired','Stressed','Anxious','Lonely','Bored','Overthinking','Focused'];

let tab='today',qi=0;
const nav=[['today','☀️','Today'],['write','✍️','Journal'],['ask','🪞','Ask me'],['next','🌙','Tomorrow']];
const NAME='Hilay'; // change to your name
const THEMES=['candy','midnight','matcha','sunset'];
const RI=['⏰','🏃','📚','🛠️','🥗','📵','😴','🫶'];
const MC=[['#5B5B7E','#9494B8'],['#4F7CFF','#7FB0FF'],['#8F6BFF','#FF8FB8'],['#14B88F','#7ADB6A'],['#FF9F1C','#FF5E7E']];
const IC={today:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/>',write:'<path d="M4 20h4L19.5 8.5a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',ask:'<path d="M11 3l2 5.5L18.5 10.5 13 12.5 11 18l-2-5.5L3.5 10.5 9 8.5z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',next:'<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>'};
function ring(p,z=84){const r=z/2-8,c=2*Math.PI*r,m=z/2;return`<svg width="${z}" height="${z}" viewBox="0 0 ${z} ${z}"><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="rgba(0,0,0,.12)" stroke-width="9"/><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="#16160F" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}" transform="rotate(-90 ${m} ${m})" style="transition:stroke-dashoffset .6s"/><text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" fill="#16160F" font-size="20" font-weight="800" font-family="Plus Jakarta Sans,sans-serif">${p}%</text></svg>`}
function pct(){const d=D(),l=T(dk()),t=RT.length+l.length,n=RT.filter(r=>d.r[r]).length+l.filter(x=>x.d).length;return t?Math.round(n/t*100):0}
const hdr=(t,s)=>`<header class="top"><div><p>${s}</p><h1>${t}</h1></div><button class="th" data-a="th" aria-label="Change theme">🎨</button></header>`;
function todoList(date,del){const l=T(date);return l.length?l.map((x,i)=>`<div style="display:flex;align-items:center"><button class="row ${x.d?'done':''}" data-a="td" data-d="${date}" data-i="${i}"><span class="ck ${x.d?'on':''}">${x.d?'✓':''}</span><span class="t">${esc(x.t)}</span></button>${del?`<button class="x" data-a="tx" data-d="${date}" data-i="${i}" aria-label="Delete">✕</button>`:''}</div>`).join(''):'<div class="empty"><b>🌱</b>Nothing here yet</div>'}
function view(){
 const d=D(),h=new Date().getHours(),g=h<5?'Still up':h<12?'Good morning':h<18?'Good afternoon':'Good evening',fd=k=>new Date(k+'T00:00'),ds=(k,o)=>fd(k).toLocaleDateString('en-IN',o);
 let o='';
 if(tab=='today'){
  let st=0;for(let i=0;i<90;i++){const e=S.days[dk(-i)];if(e&&(e.mood||e.note||e.self||Object.values(e.r||{}).some(Boolean)))st++;else if(i>0)break}
  const mc=MC[d.mood?d.mood-1:2],rd=RT.filter(r=>d.r[r]).length;
  const wk=[6,5,4,3,2,1,0].map(i=>{const k=dk(-i),e=S.days[k]||{};return`<div class="wd ${i?'':'now'}"><small>${ds(k,{weekday:'short'}).slice(0,2)}</small><b>${e.mood?MO[e.mood-1]:'·'}</b></div>`}).join('');
  o=hdr(g+', '+esc(NAME),ds(dk(),{weekday:'long',day:'numeric',month:'long'}))+
  `<section class="hero" style="--m1:${mc[0]};--m2:${mc[1]}"><div class="hrow"><div><p>Today's mood</p><h2>${d.mood?ML[d.mood-1]:'How are you?'}</h2></div><div class="big">${d.mood?MO[d.mood-1]:'🫧'}</div></div>

  <div class="grid2"><div class="tile t4"><span>🔥</span><div><b>${st}</b><br><small>day streak</small></div></div><div class="tile t3">${ring(pct())}<small>of today done</small></div></div>
  <div class="card"><div class="week">${wk}</div></div>
  <h3 class="st">What I'm feeling</h3><div class="card"><div class="chips">${TG.map(t=>`<button class="chip ${d.tags.includes(t)?'on':''}" data-a="tg" data-t="${t}">${t}</button>`).join('')}</div></div>
  <h3 class="st">Daily routine · ${rd}/${RT.length}</h3><div class="card list">${RT.map((r,i)=>`<button class="row" data-a="r" data-t="${r}"><span class="ri">${RI[i]}</span><span class="t">${r}</span><span class="sw ${d.r[r]?'on':''}"></span></button>`).join('')}</div>
  <h3 class="st">Today's to-do</h3><div class="card list">${todoList(dk(),0)}</div>`;
 }
 if(tab=='write'){
  const ks=Object.keys(S.days).filter(k=>k!=dk()&&(S.days[k].note||S.days[k].self||S.days[k].mood)).sort().reverse().slice(0,8);
  o=hdr('Journal','A quiet page, just for you')+
  `<div class="card"><div class="fld"><label class="l">📝 What happened today?</label><textarea data-f="note" placeholder="Start anywhere…">${esc(d.note)}</textarea></div>
  <div class="fld"><label class="l">🏆 One win, however small</label><input type="text" data-f="win" value="${esc(d.win)}"></div>
  <div class="fld"><label class="l">🙏 I'm grateful for…</label><input type="text" data-f="grat" value="${esc(d.grat)}"></div></div>
  <div class="card gc"><label class="l">🪞 How do I feel about myself right now?</label><textarea data-f="self" placeholder="Be honest, and be kind.">${esc(d.self)}</textarea></div>
  <div class="card"><label class="l">🤝 How much do I trust myself today?</label><div class="chips" style="margin-top:12px">${[1,2,3,4,5].map(i=>`<button class="chip ${d.trust==i?'on':''}" data-a="tr" data-i="${i}" style="flex:1">${i}</button>`).join('')}</div><p style="color:var(--mut);font-size:13px;margin-top:10px">1 is not at all, 5 is completely</p></div>
  <h3 class="st">Past entries</h3><div class="card">${ks.length?ks.map(k=>{const e=S.days[k];return`<div class="ent"><b>${e.mood?MO[e.mood-1]:'📓'} ${ds(k,{weekday:'short',day:'numeric',month:'short'})}</b><div>${esc((e.note||e.self||'').slice(0,120))}</div></div>`}).join(''):'<div class="empty"><b>📖</b>Earlier days will appear here</div>'}</div>`;
 }
 if(tab=='ask'){
  const [q,op]=Q[qi],a=S.ans[qi]||{s:[],n:''},n=Object.values(S.ans).filter(x=>x.s.length).length;
  o=hdr('Ask myself',n+' of '+Q.length+' answered')+`<div class="pb"><i style="width:${n/Q.length*100}%"></i></div>
  <div class="card gc"><span class="pill">Question ${qi+1} of ${Q.length}</span><div class="q">${esc(q)}</div>
  ${op.map((x,i)=>`<button class="opt ${a.s.includes(i)?'on':''}" data-a="o" data-i="${i}"><span class="lt">${String.fromCharCode(65+i)}</span>${esc(x)}</button>`).join('')}
  <textarea data-f="qn" placeholder="Why? Add a thought (optional)" style="min-height:76px">${esc(a.n)}</textarea>
  <div class="nav"><button class="btn g" data-a="qn" data-i="-1">Back</button><button class="btn" data-a="qn" data-i="1">${qi==Q.length-1?'Start over':'Next'}</button></div></div>
  <div class="card"><div class="dots">${Q.map((_,i)=>`<button class="${i==qi?'on':(S.ans[i]||{s:[]}).s.length?'ans':''}" data-a="qj" data-i="${i}">${i+1}</button>`).join('')}</div></div>`;
 }
 if(tab=='next'){
  const un=T(dk()).filter(x=>!x.d).length;
  o=hdr('Tomorrow',ds(dk(1),{weekday:'long',day:'numeric',month:'long'}))+
  `<div class="card"><div class="add"><input type="text" id="nt" placeholder="Add a task for tomorrow"><button class="btn" data-a="add">Add</button></div></div>
  <div class="card list">${todoList(dk(1),1)}</div>
  ${un?`<button class="btn g" data-a="carry" style="width:100%;margin-bottom:14px">Carry over ${un} unfinished from today</button>`:''}
  <div class="card"><label class="l">💌 A note to tomorrow-me</label><textarea data-f="intent" placeholder="Tomorrow, I will…">${esc((S.days[dk(1)]||{}).intent)}</textarea></div>`;
 }
 $('#app').innerHTML=o;
 $('#tabs').innerHTML=nav.map(n=>`<button class="${tab==n[0]?'on':''}" data-a="tab" data-t="${n[0]}"><svg viewBox="0 0 24 24">${IC[n[0]]}</svg>${n[2]}</button>`).join('');
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,d=D(),i=+b.dataset.i,t=b.dataset.t,dt=b.dataset.d;
 if(a=='tab'){tab=t;scrollTo(0,0)}
 else if(a=='m')d.mood=d.mood==i?0:i;
 else if(a=='tg')d.tags=d.tags.includes(t)?d.tags.filter(x=>x!=t):[...d.tags,t];
 else if(a=='r')d.r[t]=!d.r[t];
 else if(a=='tr')d.trust=i;
 else if(a=='td')T(dt)[i].d=!T(dt)[i].d;
 else if(a=='tx')T(dt).splice(i,1);
 else if(a=='add'){const v=$('#nt').value.trim();if(v)T(dk(1)).push({t:v,d:0})}
 else if(a=='carry'){T(dk()).filter(x=>!x.d).forEach(x=>T(dk(1)).push({t:x.t,d:0}))}
 else if(a=='o'){const x=S.ans[qi]||(S.ans[qi]={s:[],n:''});x.s=x.s.includes(i)?x.s.filter(y=>y!=i):[...x.s,i]}
 else if(a=='qn'){qi=(qi+i+Q.length)%Q.length}
 else if(a=='qj')qi=i;
 else if(a=='th'){S.theme=THEMES[(THEMES.indexOf(S.theme||'candy')+1)%THEMES.length];document.documentElement.dataset.t=S.theme}
 save();view()});
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;
 if(f=='qn'){(S.ans[qi]||(S.ans[qi]={s:[],n:''})).n=e.target.value}
 else if(f=='intent'){(S.days[dk(1)]||(S.days[dk(1)]={mood:0,tags:[],r:{}})).intent=e.target.value}
 else D()[f]=e.target.value;save()});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='nt')document.querySelector('[data-a=add]').click()});
document.documentElement.dataset.t=S.theme||'candy';
view();

</script></body></html>
